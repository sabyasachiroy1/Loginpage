<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brinjal Color Header</title>
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Brinjal (Eggplant) Color Header Style */
        .form-header {
            background-color: #6A4C8C; /* Brinjal (Eggplant) color */
            color: white; /* Text color */
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 36px;
            font-weight: bold;
        }

        .form-header p {
            font-size: 18px;
            margin-top: 10px;
        }

        /* Optional Image in header */
        .form-header img {
            max-width: 100px; /* Limit the image size */
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="form-header">
        <h1>Login</h1>
        
        
    </div>

    <!-- Form content here -->
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
